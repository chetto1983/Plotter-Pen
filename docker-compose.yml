# Plotter-Pen Docker Compose
# CAD editor for pen plotters with PLC integration via OPC UA
services:
  plotter:
    build:
      context: .
      dockerfile: Dockerfile
            
    image: plotter-pen:latest
    container_name: plotter-pen
    restart: always

    environment:
      # Server
      HOST: "0.0.0.0"
      PORT: "8000"
      GIN_MODE: "release"
      # no browser in the container (also set in the image)
      OPEN_BROWSER: "false"

      # Database
      DB_PATH: "/app/data/plotter.db"

      # OPC UA configuration is stored in the database (configure via UI/API)

      # Optional: API authentication
      # API_TOKEN: "your-secret-token"

    ports:
      - "41880:8000"

    volumes:
      # Persistent data (SQLite database)
      - plotter-data:/app/data

      # OPC UA certificates (named volume for proper permissions)
      - plotter-certs:/app/certs


    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plotter-data:
    driver: local
  plotter-certs:
    driver: local
