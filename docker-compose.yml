# Plotter-Pen Docker Compose
# CAD editor for pen plotters with PLC integration via OPC UA
version: "3.8"
services:
  plotter:
    #build:
      #context: .
      #dockerfile: Dockerfile
    image: plotter-pen:latest
    container_name: plotter-pen
    restart: unless-stopped

    environment:
      # Server
      HOST: "0.0.0.0"
      PORT: "8000"
      GIN_MODE: "release"

      # Database
      DB_PATH: "/app/data/plotter.db"

      # OPC UA Configuration
      OPCUA_ENDPOINT: "opc.tcp://192.168.0.1:4840"
      OPCUA_NODE_ID: "ns=4;s=Data"
      OPCUA_SECURITY_MODE: "SignAndEncrypt"
      OPCUA_SECURITY_POLICY: "Basic256Sha256"

      # Optional: API authentication
      # API_TOKEN: "your-secret-token"

    ports:
      - "41880:8000"

    volumes:
      # Persistent data (SQLite database)
      - plotter-data:/app/data

      # OPC UA certificates (mount your certs here)
      - ./certs:/app/certs:ro

      # Optional: custom config override
      # - ./opcua_config.json:/app/opcua_config.json:ro

    mem_limit: 512m
    cpus: 1.0

    #healthcheck:
     # test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
     # interval: 30s
     # timeout: 3s
     # retries: 3
     # start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plotter-data:
    driver: local
