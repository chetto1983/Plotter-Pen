<!DOCTYPE html>
<html>

<head>
    <title>Biarc Test - Circle Detection</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        canvas {
            border: 1px solid #444;
            background: #16213e;
        }

        .info {
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
            margin-top: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .success {
            color: #4ade80;
        }

        .warning {
            color: #fbbf24;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            color: #e94560;
        }
    </style>
</head>

<body>
    <h1>Circle Detection Test</h1>
    <div class="container">
        <div>
            <h3>Original Spline Points (red)</h3>
            <canvas id="original" width="400" height="400"></canvas>
        </div>
        <div>
            <h3>Detected Shapes (green=circle, yellow=polygon)</h3>
            <canvas id="fitted" width="400" height="400"></canvas>
        </div>
    </div>
    <div id="info" class="info"></div>

    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <script type="module">
        import bSpline from './src/geometry/b-spline.js';

        const ctxOrig = document.getElementById('original').getContext('2d');
        const ctxFit = document.getElementById('fitted').getContext('2d');
        const infoDiv = document.getElementById('info');

        // Circle detection function (same as DXFImporter)
        function detectCircle(points) {
            if (points.length < 10) return null;

            const p1 = points[0];
            const p2 = points[Math.floor(points.length / 3)];
            const p3 = points[Math.floor(points.length * 2 / 3)];

            const ax = p1.x, ay = p1.y;
            const bx = p2.x, by = p2.y;
            const cx = p3.x, cy = p3.y;

            const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
            if (Math.abs(d) < 1e-10) return null;

            const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
            const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;
            const r = Math.sqrt((ax - ux) ** 2 + (ay - uy) ** 2);

            if (r < 0.01 || r > 10000) return null;

            const tolerance = r * 0.02;
            for (const p of points) {
                const dist = Math.sqrt((p.x - ux) ** 2 + (p.y - uy) ** 2);
                if (Math.abs(dist - r) > tolerance) return null;
            }

            return { cx: ux, cy: uy, r };
        }

        async function runTest() {
            let html = '<h3>Test Results</h3>';

            const response = await fetch('/DXF/Laser%20Cut%20Wooden%20Earring%20Blanks%20Dangle%20Charms%20.dxf');
            const content = await response.text();
            const parser = new DxfParser();
            const dxf = parser.parseSync(content);

            const splines = dxf.entities.filter(e => e.type === 'SPLINE');
            html += `<p>Found <strong>${splines.length} splines</strong></p>`;

            // Calculate transform
            let allPoints = [];
            const splineData = [];

            for (const spline of splines) {
                const degree = spline.degreeOfSplineCurve || 3;
                const knots = spline.knotValues;
                const cp = spline.controlPoints.map(p => [p.x, p.y]);

                const minT = knots[degree];
                const maxT = knots[knots.length - 1 - degree];

                const points = [];
                for (let i = 0; i <= 100; i++) {
                    const t = minT + (i / 100) * (maxT - minT);
                    const pt = bSpline(t, degree, cp, knots);
                    points.push({ x: pt[0], y: pt[1] });
                }

                allPoints = allPoints.concat(points);
                splineData.push({ points, closed: spline.closed });
            }

            const xs = allPoints.map(p => p.x);
            const ys = allPoints.map(p => p.y);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const minY = Math.min(...ys), maxY = Math.max(...ys);
            const width = maxX - minX;
            const height = maxY - minY;
            const scale = 350 / Math.max(width, height);
            const offsetX = 200 - (minX + width / 2) * scale;
            const offsetY = 200 - (minY + height / 2) * scale;

            const transform = (p) => ({
                x: p.x * scale + offsetX,
                y: p.y * scale + offsetY
            });

            // Draw original splines
            ctxOrig.strokeStyle = '#e94560';
            ctxOrig.lineWidth = 2;

            for (const { points, closed } of splineData) {
                ctxOrig.beginPath();
                const tp = transform(points[0]);
                ctxOrig.moveTo(tp.x, tp.y);
                for (let i = 1; i < points.length; i++) {
                    const tp = transform(points[i]);
                    ctxOrig.lineTo(tp.x, tp.y);
                }
                if (closed) ctxOrig.closePath();
                ctxOrig.stroke();
            }

            // Process each spline with circle detection
            let circleCount = 0;
            let polygonCount = 0;
            const tableRows = [];

            ctxFit.lineWidth = 2;

            for (let i = 0; i < splineData.length; i++) {
                const { points, closed } = splineData[i];

                if (closed) {
                    const circle = detectCircle(points);

                    if (circle) {
                        // Draw circle
                        ctxFit.strokeStyle = '#4ade80';
                        ctxFit.beginPath();
                        const c = transform({ x: circle.cx, y: circle.cy });
                        ctxFit.arc(c.x, c.y, circle.r * scale, 0, Math.PI * 2);
                        ctxFit.stroke();

                        circleCount++;
                        tableRows.push(`<tr><td>Spline ${i + 1}</td><td class="success">Circle</td><td>r=${(circle.r).toFixed(4)}</td></tr>`);
                    } else {
                        // Draw polygon
                        ctxFit.strokeStyle = '#fbbf24';
                        ctxFit.beginPath();
                        const tp = transform(points[0]);
                        ctxFit.moveTo(tp.x, tp.y);
                        for (let j = 1; j < points.length; j++) {
                            const tp = transform(points[j]);
                            ctxFit.lineTo(tp.x, tp.y);
                        }
                        ctxFit.closePath();
                        ctxFit.stroke();

                        polygonCount++;
                        tableRows.push(`<tr><td>Spline ${i + 1}</td><td class="warning">Polygon</td><td>${points.length} points</td></tr>`);
                    }
                }
            }

            html += `<p class="success">Detected: <strong>${circleCount} circles</strong>, <strong>${polygonCount} polygons</strong></p>`;
            html += `<table><tr><th>Spline</th><th>Type</th><th>Details</th></tr>${tableRows.join('')}</table>`;

            infoDiv.innerHTML = html;
        }

        runTest().catch(e => {
            infoDiv.innerHTML = `<p style="color: #f87171;">Error: ${e.message}</p>`;
            console.error(e);
        });
    </script>
</body>

</html>
