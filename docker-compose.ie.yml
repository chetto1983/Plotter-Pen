# Plotter-Pen Docker Compose (Industrial Edge Publisher compatible)
# Use Compose v2.x schema; Industrial Edge supports 2.1–2.4.
version: "2.4"
services:
  plotter:
    image: plotter-pen:latest
    container_name: plotter-pen
    restart: always

    environment:
      # Server
      HOST: "0.0.0.0"
      PORT: "8000"
      GIN_MODE: "release"

      # Database
      DB_PATH: "/app/data/plotter.db"

      # Optional: API authentication
      # API_TOKEN: "your-secret-token"

    ports:
      - "41880:8000"

    volumes:
      # Persistent data (SQLite database)
      - plotter-data:/app/data

      # OPC UA certificates (named volume for proper permissions)
      - plotter-certs:/app/certs


    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plotter-data:
    driver: local
  plotter-certs:
    driver: local
