<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <title>Sacchi Plotter Pen - CAD Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Modular Styles -->
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/ui.css">
  <link rel="stylesheet" href="src/styles/modal.css">
  <link rel="stylesheet" href="src/styles/tool-library.css">
  <link rel="stylesheet" href="src/styles/panels.css">
  <link rel="stylesheet" href="src/styles/canvas.css">
  <link rel="stylesheet" href="src/styles/commandbar.css">
  <link rel="stylesheet" href="src/styles/gcode.css">
  <link rel="stylesheet" href="src/styles/legacy.css">
  <link rel="stylesheet" href="src/styles/plc-simulation.css">
  <link rel="stylesheet" href="src/styles/responsive.css">
  <!-- Polyfill for importmap support on older browsers (industrial HMI) -->
  <script src="src/lib/es-module-shims.js"></script>
  <!-- Importmap required by Three.js addons (Line2, LineMaterial, etc.) -->
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- App Container (React-like root) -->
  <div id="app"></div>

  <!-- Main Entry Point -->
  <script type="module" src="src/main.js"></script>
</body>

</html>
